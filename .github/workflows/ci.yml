name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install pytest pytest-cov pytest-asyncio ruff paramiko
          uv pip install -r layers/requirements.txt

      - name: Lint (ruff)
        run: uv run ruff check filters/ layers/memory/ layers/extractor/ tests/

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v --tb=short \
            --ignore=tests/test_e2e_fact_extractor.py \
            --ignore=tests/test_e2e_funnelcloud.py \
            --ignore=tests/test_e2e_ooda_loop.py \
            --ignore=tests/test_classifier.py \
            --ignore=tests/test_fact_extractor.py
