[project]
name = "aj"
version = "0.1.0"
description = "AJ - privacy-first local AI assistant (workspace tooling)"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "paramiko>=3.0",
    "requests>=2.31",
    "httpx>=0.27",
    "fastapi>=0.109",
    "qdrant-client>=1.7",
    "pydantic>=2.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["training", ".venv", "layers/pragmatics/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines: handled case-by-case

[tool.pytest.ini_options]
pythonpath = [
    "layers/pragmatics",
    "layers/memory",
    "layers/extractor",
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests requiring a running orchestrator",
]
# E2E tests use a shared orchestrator - ensure sequential execution
# Tests are ordered alphabetically by default; use -p no:randomly if randomization is enabled
asyncio_default_fixture_loop_scope = "function"
# Prevent parallel execution (if xdist is ever installed)
addopts = "-p no:xdist"
